[project]
name = "robot-console"
version = "0.1.0"
description = "Console de pilotage d'un robot autonome par WiFi."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = ["pytest", "pyinstaller"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_core", "src/robot_cli", "src/robot_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "robot-console"
version = "0.1.0"
description = "Console de pilotage d'un robot autonome par WiFi."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.3",
]

[project.scripts]
robot-console = "robot_console.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_console"]

[tool.pytest.ini_options]
testpaths = ["tests"]
